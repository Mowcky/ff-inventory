<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Request an item | Foundation First</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--navy:#0D1B2A;--navy2:#1A2D40;--gold:#C9A84C;--gold2:#E8C76A;--paper:#F0EDE8;--ink:#0D1B2A;--muted:#6B7280;--line:#E5E7EB;
  --rap:#0F8A5F;--gpw:#1B6CA8;--lfc:#D9731A;--bad:#B91C1C;--ok:#065F46;--okbg:#D1FAE5;--warnbg:#FEF3C7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Figtree","Segoe UI",Arial,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.5;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{background:var(--navy);color:#fff;padding:env(safe-area-inset-top,0px) 0 0}
.bar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 18px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.bar b{font-size:15px}
main{max-width:720px;margin:0 auto;padding:22px 18px 60px}
.hero{background:var(--navy);color:#fff;border-radius:14px;padding:24px 24px 22px;margin-bottom:18px;border-bottom:4px solid var(--gold)}
.hero h1{font-size:28px;font-weight:800;line-height:1.15}
.hero p{color:#B8C4D1;margin-top:8px;font-size:15px}
.card{background:#fff;border-radius:14px;padding:22px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.full{grid-column:1 / -1}
label{display:block;font-size:13.5px;font-weight:700;color:#374151;margin-bottom:5px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #D1D5DB;border-radius:9px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.btn{border:1px solid transparent;border-radius:10px;padding:13px 20px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-gold{background:var(--gold);color:var(--navy)}.btn-gold:hover{background:var(--gold2)}
.btn-line{background:#fff;border-color:#D1D5DB;color:var(--navy)}
.foot{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}
.err{color:var(--bad);font-size:14.5px;font-weight:600}
.done{background:#fff;border-radius:14px;padding:24px}
.done h2{font-size:22px;font-weight:800;margin-bottom:8px}
.done ol{padding-left:22px;margin:10px 0}
.done li{margin:4px 0}
.mail{background:#F7F5F0;border-radius:10px;padding:12px 14px;font-size:13.5px;white-space:pre-wrap;word-break:break-word;margin-top:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.note{font-size:13px;color:var(--muted);margin-top:16px}
.budget{margin-top:8px;background:var(--okbg);color:var(--ok);border-radius:9px;padding:9px 12px;font-size:14px}
.budget.over{background:var(--warnbg);color:#7C4A03}
.banner{background:var(--warnbg);color:#7C4A03;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:14.5px}
@media (max-width:620px){.grid{grid-template-columns:1fr}.hero h1{font-size:24px}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in"><div class="mark" aria-hidden="true">FF</div><b>Foundation First</b></div></header>
<main id="app"><p>Loading…</p></main>
<script>
var CFG=null;
var FUNDS=["Mixed Delivery","Business Academy","ITSN","General Operating","Other Grant"];
var OFF={RAP:'RAP Office',GPW:'GPW Office',LFC:'LFC Office'};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fdate(s){var p=String(s||'').split('-');return p.length===3?p[1]+'/'+p[2]+'/'+p[0]:'';}
function b64url(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function siteBase(){return location.href.split('#')[0].split('?')[0].replace(/request\.html$/i,'');}
function people(){
  return (CFG.people||[]).filter(function(p){return p.pos&&!p.archived&&!/-00$/.test(p.pos)&&!/^vacant$/i.test(p.name||'')&&!/vacant/i.test(p.title||'')&&!/extra desk/i.test(p.name||'');});
}
var DEF={title:'Request an item',intro:'Need something for your work? Paste a link to it below. Your request goes to the operations team for approval, and you’ll hear back by email.',
  button:'Send request',done:'You’ll hear back once it’s approved or not.',note:'Your name isn’t listed, or something looks wrong? Contact the operations team.',
  fields:[{key:'who',label:'Who is this for?',required:true,show:true,type:'person',width:'full'},
   {key:'kind',label:'What kind of request is this?',hint:'Office supplies come out of your yearly allowance (July 1 – June 30).',required:true,show:true,type:'kind',width:'full',options:['Office supplies (from my yearly allowance)','Equipment or something else']},
   {key:'item',label:'What do you need?',hint:'For example: Logitech wireless mouse',required:true,show:true,type:'text',width:'full'},
   {key:'link',label:'Link to the item',hint:'Paste the Amazon or store page so it can be ordered exactly.',required:true,show:true,type:'url',width:'full'},
   {key:'qty',label:'Quantity',required:false,show:true,type:'number',width:'half'},
   {key:'cost',label:'Price each ($)',hint:'From the link, if you know it',required:false,show:true,type:'money',width:'half'},
   {key:'needed',label:'Needed by',required:false,show:true,type:'date',width:'half'},
   {key:'funding',label:'Funding source',required:false,show:true,type:'select',width:'half',options:FUNDS},
   {key:'reason',label:'Why do you need it?',required:false,show:true,type:'textarea',width:'full'}]};
function cfgForm(){
  var c=JSON.parse(JSON.stringify((CFG.settings&&CFG.settings.requestForm)||DEF));
  ['title','intro','button','done','note'].forEach(function(k){if(c[k]==null)c[k]=DEF[k];});
  c.fields=c.fields||[];DEF.fields.forEach(function(d){if(!c.fields.some(function(f){return f.key===d.key;})){var nd=JSON.parse(JSON.stringify(d));
    if(d.key==='kind'){var wi=c.fields.findIndex(function(f){return f.key==='who';});c.fields.splice(wi+1,0,nd);}else c.fields.push(nd);}});
  c.fields.forEach(function(f){if(f.key==='kind'){f.type='kind';f.options=(f.options||[]).slice(0,2);while(f.options.length<2)f.options.push(DEF.fields[1].options[f.options.length]);}});
  c.fields.forEach(function(f){if(f.key==='who'||f.key==='item'){f.show=true;f.required=true;}});
  return c;
}
var FORM=null;
function input(f){
  var id='f_'+f.key,pre=decodeURIComponent(location.hash.replace(/^#/,'')).toUpperCase();
  if(f.type==='person'){
    return '<select id="'+id+'"><option value="">Choose your name</option>'+['RAP','GPW','LFC'].map(function(o){
      var ps=people().filter(function(p){return p.office===o;}).sort(function(a,b){return a.pos<b.pos?-1:1;});
      if(!ps.length)return '';
      return '<optgroup label="'+OFF[o]+'">'+ps.map(function(p){return '<option value="'+esc(p.pos)+'"'+(p.pos===pre?' selected':'')+'>'+esc(p.name+(p.sheetLabel?' ('+p.sheetLabel+')':''))+'</option>';}).join('')+'</optgroup>';
    }).join('')+'</select>';
  }
  if(f.type==='kind')return '<select id="'+id+'"><option value="">Choose one</option><option value="supplies">'+esc(f.options[0])+'</option><option value="other">'+esc(f.options[1])+'</option></select><div class="budget" id="budgetNote" hidden></div>';
  if(f.type==='textarea')return '<textarea id="'+id+'"></textarea>';
  if(f.type==='select')return '<select id="'+id+'"><option value="">'+(f.required?'Choose one':'Not sure')+'</option>'+(f.options||[]).filter(Boolean).map(function(o){return '<option>'+esc(o)+'</option>';}).join('')+'</select>';
  if(f.type==='yesno')return '<select id="'+id+'"><option value=""></option><option>Yes</option><option>No</option></select>';
  var t={number:'number',money:'number',date:'date',url:'url'}[f.type]||'text';
  return '<input id="'+id+'" type="'+t+'"'+(f.type==='money'?' min="0" step="0.01" inputmode="decimal"':'')+(f.type==='number'?' min="0" step="1"':'')+(f.key==='qty'?' value="1"':'')+(f.type==='url'?' inputmode="url" placeholder="https://"':'')+'>';
}
function form(){
  FORM=cfgForm();
  var h=(CFG.preview?'<div class="banner">Preview. On the live site, Send opens the person’s email app. Here you’ll see the email that would be sent.</div>':'')+
   '<section class="hero"><h1>'+esc(FORM.title)+'</h1><p>'+esc(FORM.intro)+'</p></section><form class="card" id="f" novalidate><div class="grid">'+
   FORM.fields.filter(function(f){return f.show;}).map(function(f){
     return '<div'+(f.width==='half'?'':' class="full"')+'><label for="f_'+esc(f.key)+'">'+esc(f.label)+(f.required?' *':'')+'</label>'+input(f)+(f.hint?'<div class="hint">'+esc(f.hint)+'</div>':'')+'</div>';
   }).join('')+'</div><div class="foot"><button class="btn btn-gold" type="submit">'+esc(FORM.button)+'</button><span class="err" id="err" role="alert"></span></div></form>'+
   (FORM.note?'<p class="note">'+esc(FORM.note)+'</p>':'');
  document.getElementById('app').innerHTML=h;
  document.getElementById('f').onsubmit=submit;
  var w=document.getElementById('f_who');(w&&w.value?document.getElementById('f_kind')||document.getElementById('f_item'):w).focus();
  ['f_who','f_kind','f_cost','f_qty'].forEach(function(id){var el=document.getElementById(id);if(el){el.addEventListener('change',budgetNote);el.addEventListener('input',budgetNote);}});budgetNote();
}
function fyOf(d){var y=+String(d).slice(0,4),m=+String(d).slice(5,7);return m>=7?y+1:y;}
function money(n){n=Number(n||0);return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function leftFor(name){
  var s=CFG.supplies||{},fy=fyOf(today()),allow=s.overrides&&s.overrides[name]!=null?+s.overrides[name]:(s.allowance!=null?+s.allowance:100);
  var spent=(s.purchases||[]).filter(function(x){return x.name===name&&fyOf(x.date)===fy;}).reduce(function(t,x){return t+(+x.amount||0);},0);
  return {allow:allow,left:Math.round((allow-spent)*100)/100,fy:fy};
}
function budgetNote(){
  var el=document.getElementById('budgetNote');if(!el)return;
  var pos=v('who'),kind=v('kind');
  if(kind!=='supplies'||!pos){el.hidden=true;return;}
  var p=people().find(function(x){return x.pos===pos;});if(!p){el.hidden=true;return;}
  var b=leftFor(p.name),cost=(+v('cost')||0)*(+v('qty')||1);
  el.hidden=false;el.className='budget'+(cost>b.left?' over':'');
  el.innerHTML='You have <b>'+money(b.left)+'</b> left of '+money(b.allow)+' for July 1, '+(b.fy-1)+' – June 30, '+b.fy+'.'+(cost>b.left?' This request is '+money(cost-b.left)+' over. You can still send it; the operations team will decide.':'');
}
function v(key){var el=document.getElementById('f_'+key);return el?el.value.trim():'';}
function submit(e){
  e.preventDefault();
  var err=document.getElementById('err'),shown=FORM.fields.filter(function(f){return f.show;});
  for(var i=0;i<shown.length;i++){var f=shown[i];if(f.required&&!v(f.key)){err.textContent=(f.type==='person'?'Choose your name.':'Please answer “'+f.label+'”.');document.getElementById('f_'+f.key).focus();return;}}
  err.textContent='';
  var pos=v('who'),p=people().find(function(x){return x.pos===pos;});
  var r={by:p.name,kind:v('kind')||undefined,item:v('item'),submitted:today(),status:'Pending',id:'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
  if(v('link'))r.link=v('link');r.qty=+v('qty')||1;
  if(v('cost')!==''&&!isNaN(+v('cost')))r.cost=+v('cost');
  ['needed','funding','reason'].forEach(function(k){if(v(k))r[k]=v(k);});
  var extra=shown.filter(function(f){return /^c_/.test(f.key)&&v(f.key);}).map(function(f){return {label:f.label,value:f.type==='date'?fdate(v(f.key)):v(f.key)};});
  if(extra.length)r.extra=extra;
  var add=siteBase()+'#'+pos+'/request/'+b64url(JSON.stringify(r));
  var kf=FORM.fields.find(function(f){return f.key==='kind';});
  var lines=['New '+(r.kind==='supplies'?'office supply':'inventory')+' request','','For: '+p.name+' ('+pos+')'];
  if(r.kind)lines.push('Type: '+(r.kind==='supplies'?kf.options[0]:kf.options[1]));
  if(r.kind==='supplies'){var bl=leftFor(p.name);lines.push('Allowance left: '+money(bl.left)+' of '+money(bl.allow));}
  lines.push('Item: '+r.item);
  if(r.link)lines.push('Link: '+r.link);lines.push('Quantity: '+r.qty);
  if(r.cost!=null)lines.push('Price each: $'+r.cost.toFixed(2));if(r.needed)lines.push('Needed by: '+fdate(r.needed));if(r.funding)lines.push('Funding: '+r.funding);if(r.reason)lines.push('Why: '+r.reason);
  (r.extra||[]).forEach(function(x){lines.push(x.label+': '+x.value);});
  lines.push('','To add this to the inventory tracker, open:',add);
  var to=(CFG.settings||{}).requestEmail||'';
  var subject=(r.kind==='supplies'?'Office supply request – ':'Inventory request – ')+pos+' – '+r.item;
  var href='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(lines.join('\n'));
  if(!CFG.preview){var a=document.createElement('a');a.href=href;a.style.display='none';document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},1000);}
  document.getElementById('app').innerHTML='<div class="done"><h2>'+(CFG.preview?'Here’s the email that would be sent':'Almost done: press Send in your email')+'</h2>'+
    (CFG.preview?'':'<p>Your email app should have opened a message to the operations team with your request filled in.</p><ol><li>Switch to your email app.</li><li>Press <b>Send</b>.</li></ol><p>'+esc(FORM.done)+'</p>')+
    '<div class="mail"><b>To:</b> '+esc(to||'(request email not set yet)')+'\n<b>Subject:</b> '+esc(subject)+'\n\n'+esc(lines.join('\n'))+'</div>'+
    '<div class="foot">'+(CFG.preview?'':'<a class="btn btn-gold" href="'+esc(href)+'">Open the email again</a>')+'<button class="btn btn-line" id="again">Request something else</button></div></div>';
  document.getElementById('again').onclick=function(){form();window.scrollTo(0,0);};
  window.scrollTo(0,0);
}
function notReady(msg){document.getElementById('app').innerHTML='<section class="hero"><h1>Requests aren’t open yet</h1><p>'+msg+'</p></section>';}
function start(cfg){
  CFG=cfg;
  if(!cfg.preview&&!(cfg.settings&&cfg.settings.requestEmail))return notReady('The operations team hasn’t turned on item requests yet. Please check back soon or contact them directly.');
  if(cfg.locked)return notReady('This request page needs an update. Please contact the operations team.');
  form();
}
if(window.__DATA__)start(Object.assign({preview:true},window.__DATA__));
else fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json();}).then(start).catch(function(){notReady('The page couldn’t load. Check your connection and refresh.');});
window.addEventListener('hashchange',function(){if(CFG&&document.getElementById('f'))form();});
</script>
</body>
</html>
