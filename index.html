<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foundation First Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js" defer></script>
<style>
:root{
  --navy:#0D1B2A; --navy2:#1A2D40; --gold:#C9A84C; --gold2:#E8C76A;
  --paper:#F0EDE8; --card:#FFFFFF; --ink:#0D1B2A; --muted:#6B7280; --line:#E5E7EB;
  --rap:#0F8A5F; --gpw:#1B6CA8; --lfc:#D9731A;
  --ok:#065F46; --okbg:#D1FAE5; --warn:#B45309; --warnbg:#FEF3C7; --bad:#B91C1C; --badbg:#FCEBEB;
  --font:"Figtree", "Segoe UI", Arial, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:70px}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit}
button,input{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:env(safe-area-inset-top,0px) 0 0}
.bar-in{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.mark{width:34px;height:34px;border-radius:8px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;text-decoration:none}
.crumbs{display:flex;gap:6px;align-items:center;font-size:14px;min-width:0;flex-wrap:wrap}
.crumbs a{color:#C9D3DE;text-decoration:none}
.crumbs a:hover{color:#fff;text-decoration:underline}
.crumbs span.sep{color:#56677A}
.crumbs b{color:#fff;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .sp{flex:1}
.btn{border:1px solid transparent;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:var(--gold2)}
.btn-ghost{background:transparent;color:#fff;border-color:#3A4D62}
.btn-ghost:hover{border-color:#8FA3B8}
.btn-line{background:#fff;color:var(--navy);border-color:#D1D5DB}
.btn-line:hover{border-color:var(--navy)}

main{max-width:1200px;margin:0 auto;padding:22px 18px 60px}

/* hero band */
.hero{background:var(--navy);color:#fff;border-radius:14px;padding:26px 28px;margin-bottom:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:100%;background:var(--accent,var(--gold))}
.hero h1{font-size:30px;line-height:1.15;font-weight:800;letter-spacing:-.01em}
.hero .sub{color:#A9B7C6;margin-top:6px;font-size:15px}
.stats{display:flex;flex-wrap:wrap;gap:10px 34px;margin-top:20px}
.stat b{display:block;font-size:26px;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:13px;color:#A9B7C6}
.stat.alert b{color:#FCA5A5}

/* office tiles (home) */
.offices{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.office{background:var(--card);border-radius:14px;padding:20px 22px 18px;text-decoration:none;border-left:8px solid var(--oc);display:block}
.office:hover{box-shadow:0 0 0 2px var(--oc) inset}
.office h2{font-size:22px;font-weight:800}
.office .who{color:var(--muted);font-size:14px;margin-top:2px}
.office .nums{display:flex;gap:22px;margin-top:14px;font-variant-numeric:tabular-nums}
.office .nums b{font-size:20px;display:block}
.office .nums span{font-size:12.5px;color:var(--muted)}
.office .go{margin-top:14px;font-weight:700;color:var(--oc);font-size:14px}

.section{margin-top:28px}
.section h3{font-size:17px;font-weight:800;margin-bottom:10px}
.panel{background:var(--card);border-radius:12px;padding:6px 0}
.alert-row{display:grid;grid-template-columns:90px 1fr auto;gap:12px;padding:10px 18px;border-top:1px solid var(--line);align-items:center;text-decoration:none}
.alert-row:first-child{border-top:none}
.alert-row:hover{background:#FAFAF8}
.empty{padding:16px 18px;color:var(--muted)}

/* search */
.search{display:flex;gap:10px;margin-bottom:18px}
.search input{flex:1;max-width:460px;padding:11px 14px;border-radius:10px;border:1px solid #D1D5DB;font-size:15px;background:#fff}

/* asset-tag cards (office view) */
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.tag{background:var(--card);border-radius:12px;text-decoration:none;display:grid;grid-template-columns:1fr 92px;gap:6px 12px;padding:16px 16px 14px;position:relative;border:1px solid #E7E2D8}
.tag::before{content:"";position:absolute;top:14px;left:-1px;width:5px;height:34px;border-radius:0 4px 4px 0;background:var(--oc)}
.tag:hover{border-color:var(--navy)}
.tag .pos{font-weight:800;font-size:18px;color:var(--oc);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.tag .nm{font-weight:700;font-size:16px;line-height:1.25;margin-top:2px}
.tag .tt{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.3}
.tag .qr{grid-row:1 / span 2;grid-column:2;align-self:start;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px}
.tag .qr canvas{display:block;width:80px;height:80px}
.tag .meta{grid-column:1 / -1;display:flex;gap:16px;font-size:13px;color:var(--muted);border-top:1px dashed #E2DCCF;padding-top:10px;margin-top:6px;font-variant-numeric:tabular-nums}
.tag .meta b{color:var(--ink)}
.tag .flag{color:var(--warn);font-weight:700}
.tag.vacant .nm{color:var(--muted);font-style:italic}

/* person view */
.person-head{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:start}
.person-head .pos{color:var(--gold2);font-weight:800;font-size:15px;letter-spacing:.03em}
.person-head h1{margin-top:2px}
.bigqr{background:#fff;border-radius:10px;padding:8px;text-align:center}
.bigqr canvas{display:block;width:120px;height:120px}
.bigqr small{display:block;color:var(--navy);font-weight:700;font-size:12px;margin-top:4px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tools input{flex:1;min-width:200px;max-width:360px;padding:10px 13px;border-radius:10px;border:1px solid #D1D5DB;font-size:15px;background:#fff}
.chipset{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid #D1D5DB;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--navy)}
.chip{text-decoration:none}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}

.items{background:var(--card);border-radius:12px;overflow:hidden}
.ihead,.irow{display:grid;grid-template-columns:minmax(180px,2.2fr) 1.4fr 1fr 1fr .9fr 1.1fr;gap:12px;align-items:center;padding:11px 16px}
.ihead{background:var(--navy2);color:#fff;font-size:12.5px;font-weight:700}
.irow{border-top:1px solid var(--line);cursor:pointer}
.irow:nth-child(even){background:#FAFAF8}
.irow:hover{background:#F3F1EC}
.iname{font-weight:700;line-height:1.25}
.iname small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:340px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:12px;font-weight:700;line-height:1.3}
.c-elec{background:#DBEAFE;color:#1E40AF}.c-acc{background:#D1FAE5;color:#065F46}.c-furn{background:#FEF3C7;color:#78350F}
.c-stor{background:#EDE9FE;color:#4C1D95}.c-sup{background:#FCE7F3;color:#9D174D}.c-prog{background:#E0F2FE;color:#075985}.c-misc{background:#F3F4F6;color:#4B5563}
.w-ok{background:var(--okbg);color:var(--ok)}.w-soon{background:var(--warnbg);color:var(--warn)}.w-exp{background:var(--badbg);color:var(--bad)}.w-none{color:var(--muted);background:transparent;padding-left:0}
.detail{grid-column:1 / -1;display:none;background:#F7F5F0;border-radius:10px;padding:12px 14px;margin-top:4px;font-size:13.5px}
.irow.open .detail{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 18px}
.detail div span{display:block;color:var(--muted);font-size:12px}
.detail a{color:var(--rap)}
.lbl-m{display:none}

details.hist{margin-top:22px;background:var(--card);border-radius:12px;padding:14px 18px}
details.hist summary{cursor:pointer;font-weight:700}
.hrow{display:grid;grid-template-columns:2fr 1fr 1fr 1.4fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}

.note{font-size:13px;color:var(--muted);margin-top:14px}
.banner-warn{background:var(--warnbg);color:#7C4A03;border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:14px}

/* stickers */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,2in);gap:.18in;justify-content:start}
.sticker{width:2in;height:2in;border:1px dashed #BFB8A8;border-radius:.12in;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:.08in;text-align:center}
.sticker canvas{width:1.25in;height:1.25in;display:block}
.sticker .sp1{font-weight:800;font-size:13pt;color:var(--navy);margin-top:3px;line-height:1}
.sticker .sp2{font-size:7.5pt;color:#333;margin-top:2px;line-height:1.15;max-width:1.8in;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sticker .sp3{font-size:6pt;color:#555;margin-top:1px}

/* mobile */
@media (max-width:760px){
  .hero{padding:20px}
  .hero h1{font-size:24px}
  .person-head{grid-template-columns:1fr}
  .bigqr{display:none}
  .ihead{display:none}
  .irow{grid-template-columns:1fr auto;gap:6px 10px;padding:12px 14px}
  .irow .c-loc,.irow .c-date{display:none}
  .irow .c-cat{grid-column:1}
  .irow .c-war{grid-column:2;justify-self:end}
  .irow .c-cost{grid-column:2;grid-row:1}
  .iname small{max-width:220px}
  .bar .hide-m{display:none}
}
@media print{
  .bar,.tools,.noprint,details.hist summary::marker{display:none!important}
  body{background:#fff}
  main{padding:0;max-width:none}
  .hero{border-radius:0;padding:10px 0;background:#fff;color:#000}
  .hero::after{display:none}
  .hero .sub,.stat span{color:#444}.stat b{color:#000}
  .irow .detail{display:none!important}
  .sticker{page-break-inside:avoid}
  .sheet{gap:.12in}
  @page{margin:.4in}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- editing ---- */
.btn-sm{padding:6px 11px;font-size:13px}
.btn-danger{background:#fff;color:var(--bad);border-color:#F3C4C4}.btn-danger:hover{border-color:var(--bad)}
.acts{grid-column:1 / -1;display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hero .acts{margin-top:16px}
.hero .btn-line{background:transparent;color:#fff;border-color:#3A4D62}.hero .btn-line:hover{border-color:#8FA3B8}
.savebar{position:sticky;top:54px;z-index:19;background:var(--warnbg);color:#7C4A03;border-bottom:1px solid #F1D48A}
.savebar .in{max-width:1200px;margin:0 auto;padding:9px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px}
.savebar .sp{flex:1}
.ov{position:fixed;inset:0;background:rgba(13,27,42,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 14px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:22px 22px 18px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{font-size:20px;font-weight:800;margin-bottom:4px}
.modal .lede{color:var(--muted);font-size:14px;margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fgrid .full{grid-column:1 / -1}
.fld label{display:block;font-size:12.5px;font-weight:700;color:#374151;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid #D1D5DB;border-radius:8px;font-size:15px;font-family:inherit;background:#fff;color:var(--ink)}
.fld textarea{min-height:64px;resize:vertical}
.fld .hint{font-size:12px;color:var(--muted);margin-top:3px}
.fsec{grid-column:1 / -1;font-size:13px;font-weight:800;color:var(--navy);border-top:1px solid var(--line);padding-top:12px;margin-top:4px}
.mfoot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.err{color:var(--bad);font-size:13.5px;margin-top:10px;min-height:1em}
.choice{display:block;border:1px solid #D1D5DB;border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.choice:has(input:checked){border-color:var(--navy);box-shadow:0 0 0 1px var(--navy) inset}
.choice b{display:block}.choice span{font-size:13.5px;color:var(--muted)}
.choice input{margin-right:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.hrow .hact{justify-self:end}
.hrow{grid-template-columns:2fr 1fr 1fr 1.4fr auto;align-items:center}
.arch-row{display:grid;grid-template-columns:90px 1fr auto auto;gap:12px;padding:12px 18px;border-top:1px solid var(--line);align-items:center}
.arch-row:first-child{border-top:none}
@media (max-width:760px){.fgrid{grid-template-columns:1fr}.hrow{grid-template-columns:1fr auto}.arch-row{grid-template-columns:1fr auto}}
@media print{.savebar,.acts,.ov,.toast{display:none!important}}

/* ---- requests ---- */
.reqs{background:var(--card);border-radius:12px;padding:14px 18px;margin-top:4px}
.reqs-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px}
.reqs-head h3{font-size:17px;font-weight:800;display:flex;gap:8px;align-items:center}
.rq{display:grid;grid-template-columns:1fr auto;gap:8px 16px;border-top:1px solid var(--line);padding:12px 0;align-items:start}
.rq-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rq-meta{font-size:13.5px;color:var(--muted);margin-top:3px}
.rq-meta a{color:var(--gpw);font-weight:600}
.rq-dec{font-size:13.5px;margin-top:6px;background:#F7F5F0;border-radius:8px;padding:6px 10px;display:inline-block}
.rq .acts{grid-column:auto;margin-top:0;justify-content:flex-end}
.rq-closed{margin-top:6px}.rq-closed summary{cursor:pointer;font-weight:700;font-size:14px;padding:8px 0;color:var(--muted)}
@media (max-width:760px){.rq{grid-template-columns:1fr}.rq .acts{justify-content:flex-start}}

/* ---- request form editor ---- */
.fe{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:start}
.fe-h{font-size:17px;font-weight:800;margin-bottom:10px}
.fe-field{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:10px;background:#fff}
.fe-field.off{background:#F7F7F5;opacity:.75}
.fe-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.fe-type{font-size:12.5px;font-weight:700;color:var(--muted)}
.fe-move{display:flex;gap:6px}.fe-move .btn{padding:4px 10px}.fe-move .btn:disabled{opacity:.35;cursor:default}
.fe-checks{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:10px}
.fe-chk{font-size:14px;display:flex;gap:6px;align-items:center;cursor:pointer}
.fe-chk input{width:17px;height:17px}
.fe-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.fe-sticky{position:sticky;top:76px}
.fe-plabel{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fe-preview{background:var(--paper);border:1px solid #E2DCCF;border-radius:14px;padding:14px;max-height:calc(100vh - 120px);overflow:auto}
.pv-hero{background:var(--navy);color:#fff;border-radius:12px;padding:16px 16px 14px;border-bottom:4px solid var(--gold);margin-bottom:12px}
.pv-h1{font-size:21px;font-weight:800}
.pv-hero p{color:#B8C4D1;font-size:13.5px;margin-top:6px}
.pv-card{background:#fff;border-radius:12px;padding:14px}
.pv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.pv-f.full{grid-column:1 / -1}
.pv-f label{display:block;font-size:12.5px;font-weight:700;color:#374151;margin-bottom:4px}
.pv-f input,.pv-f select,.pv-f textarea{width:100%;padding:8px 10px;border:1px solid #D1D5DB;border-radius:8px;font-size:14px;font-family:inherit;background:#fff}
.pv-f textarea{min-height:60px}
.pv-f .hint{font-size:12px;color:var(--muted);margin-top:3px}
@media (max-width:900px){.fe{grid-template-columns:1fr}.fe-sticky{position:static}}

/* ---- supply budget ---- */
.sup-oh{font-size:17px;font-weight:800;margin:22px 0 10px}
.sup-head,.sup-row{display:grid;grid-template-columns:minmax(170px,2fr) 1fr 1fr 1fr .8fr 1.1fr;gap:12px;align-items:center;padding:11px 16px}
.sup-head{background:var(--navy2);color:#fff;font-size:12.5px;font-weight:700}
.sup-row{border-top:1px solid var(--line);cursor:pointer}
.sup-row:nth-child(odd){background:#FAFAF8}
.sup-row:hover{background:#F3F1EC}
.sup-row small{display:block;color:var(--muted);font-size:12.5px}
.sup-detail{grid-column:1 / -1;display:none;background:#F7F5F0;border-radius:10px;padding:8px 14px 12px;cursor:default}
.sup-row.open .sup-detail{display:block}
.sup-p{display:grid;grid-template-columns:minmax(0,2.4fr) auto auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.sup-p:first-child{border-top:none}
.sup-p small{display:block;color:var(--muted);font-size:12.5px}
.sup-p b{overflow-wrap:anywhere}
.sup-card{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border-radius:12px;padding:12px 18px;margin-bottom:12px;text-decoration:none;border-left:5px solid var(--gold)}
.sup-card:hover{box-shadow:0 0 0 1px var(--gold) inset}
.sup-home{display:flex;gap:28px;align-items:center;padding:16px 18px;text-decoration:none;flex-wrap:wrap}
.sup-home span{font-size:14px;color:var(--muted)}.sup-home b{color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums}
.sup-home .go{margin-left:auto;font-weight:700;color:var(--gpw)}
@media (max-width:760px){.sup-head{display:none}.sup-row{grid-template-columns:1fr auto;gap:4px 10px}.sup-row>.num:nth-child(2),.sup-row>.num:nth-child(3),.sup-row>.num:nth-child(5){display:none}
  .sup-p{grid-template-columns:1fr auto}.sup-p .acts{grid-column:1 / -1}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <a class="mark" href="#" aria-label="All offices">FF</a>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="sp"></div>
  <span id="barBtns"></span>
</div></header>
<div class="savebar" id="savebar" style="display:none"></div>
<main id="app"><p class="empty">Loading inventory…</p></main>
<script>
var DB=null, PEOPLE=[], BYPOS={}, DIRTY=false, SERVER_SHA=null;
var PREVIEW = !!window.__DATA__;
var OFFICES=[{k:"RAP",name:"RAP Office",region:"Rappahannock Area",c:"var(--rap)"},
             {k:"GPW",name:"GPW Office",region:"Greater Prince William",c:"var(--gpw)"},
             {k:"LFC",name:"LFC Office",region:"LFC Area",c:"var(--lfc)"}];
var OFF={}; OFFICES.forEach(function(o){OFF[o.k]=o;});
var CATS=["Technology & Electronics","Technology Accessories","Office Furniture","Storage & Organization","Office Supplies","Program / Classroom Materials","Miscellaneous"];
var CONDS=["New","Good","Damaged","Needs Repair","Lost","Retired"];
var LOCS=["On-Site Office","Home Office","Portable"];
var FUNDS=["Mixed Delivery","Business Academy","ITSN","General Operating","Other Grant"];
var STATUSES=["Assigned","In Repair","Loaned Out"];
var REASONS=["Returned to Office","Disposed","Lost / Stolen","Employee Departed","Other"];
var K_DRAFT='ffinv_draft', K_GH='ffinv_github';

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function money(n){if(n==null||n==='')return '';n=Number(n);return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function money0(n){return '$'+Math.round(n||0).toLocaleString('en-US');}
function fdate(s){if(!s)return '';var p=String(s).slice(0,10).split('-');return p.length===3?p[1]+'/'+p[2]+'/'+p[0]:s;}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function stamp(){var d=new Date();return today()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
function uid(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function baseURL(){return location.href.split('#')[0].split('?')[0].replace(/index\.html$/i,'');}
function linkFor(h){return baseURL()+'#'+h;}
function store(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function load(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function toast(msg){document.querySelectorAll('.toast').forEach(function(x){x.remove();});var t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},3200);}

function total(it){if(it.qty&&it.unitCost)return it.qty*it.unitCost;if(it.total!=null&&it.total!=='')return Number(it.total);return null;}
function wStatus(it){
  if(it.warranty!=='Yes')return it.warranty==='No'?'none':'unknown';
  if(!it.warrantyExp)return 'nodate';
  var d=new Date(it.warrantyExp+'T00:00:00'),now=new Date();now.setHours(0,0,0,0);
  var days=Math.round((d-now)/86400000);
  if(days<0)return 'expired'; if(days<=90)return 'soon'; return 'active';
}
function wBadge(it){
  var s=wStatus(it);
  if(s==='active')return '<span class="badge w-ok">Until '+fdate(it.warrantyExp)+'</span>';
  if(s==='soon')return '<span class="badge w-soon">Ends '+fdate(it.warrantyExp)+'</span>';
  if(s==='expired')return '<span class="badge w-exp">Expired '+fdate(it.warrantyExp)+'</span>';
  if(s==='nodate')return '<span class="badge w-soon">Yes, date missing</span>';
  if(s==='none')return '<span class="badge w-none">None</span>';
  return '<span class="badge w-none">Unknown</span>';
}
function catClass(c){c=(c||'').toLowerCase();
  if(c.indexOf('electron')>-1)return'c-elec';if(c.indexOf('accessor')>-1)return'c-acc';if(c.indexOf('furniture')>-1)return'c-furn';
  if(c.indexOf('storage')>-1)return'c-stor';if(c.indexOf('suppl')>-1)return'c-sup';if(c.indexOf('program')>-1)return'c-prog';return'c-misc';}
function stickerNeeded(it){var t=total(it);return t!=null&&t>50&&it.stickerApplied!=='Yes';}
function summary(p){
  var s={items:p.items.length,value:0,war:0,soon:0,exp:0,stick:0};
  p.items.forEach(function(it){var t=total(it);if(t)s.value+=t;if(it.warranty==='Yes')s.war++;var w=wStatus(it);if(w==='soon')s.soon++;if(w==='expired')s.exp++;if(stickerNeeded(it))s.stick++;});
  return s;
}
function displayName(p){return p.name+(p.sheetLabel?' ('+p.sheetLabel+')':'');}
function isVacant(p){return /^vacant$/i.test(p.name||'')||/vacant/i.test(p.title||'')||/extra desk/i.test(p.name||'');}
function active(){return PEOPLE.filter(function(p){return !p.archived;});}
function posLabel(p){return p.pos+' – '+displayName(p);}

function drawQR(canvas,text,px){
  var ctx=canvas.getContext('2d');
  try{
    var qr=qrcode(0,'M');qr.addData(text);qr.make();
    var n=qr.getModuleCount(),quiet=2,cell=Math.max(1,Math.floor(px/(n+quiet*2)));
    var size=cell*(n+quiet*2);canvas.width=canvas.height=size;
    ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);ctx.fillStyle='#0D1B2A';
    for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(qr.isDark(r,c))ctx.fillRect((c+quiet)*cell,(r+quiet)*cell,cell,cell);
  }catch(e){canvas.width=canvas.height=px;ctx.fillStyle='#eee';ctx.fillRect(0,0,px,px);}
}
function paintQRs(){document.querySelectorAll('canvas[data-qr]').forEach(function(c){drawQR(c,c.getAttribute('data-qr'),+c.getAttribute('data-px')||240);});}

/* ---------- saving ---------- */
function index(){BYPOS={};PEOPLE.forEach(function(p){BYPOS[p.pos]=p;});}
function changed(msg){
  DIRTY=true;DB.people=PEOPLE;DB.generated=stamp();
  store(K_DRAFT,{savedAt:stamp(),db:DB});
  index();renderSaveBar();route(true);
  if(msg)toast(msg);
}
function gh(){var g=load(K_GH);if(g&&g.token&&g.owner&&g.repo)return g;return null;}
function ghGuess(){var m=location.hostname.match(/^([^.]+)\.github\.io$/i);var seg=location.pathname.split('/').filter(Boolean)[0]||'';
  return {owner:m?m[1]:'',repo:m&&seg&&!/\.html$/.test(seg)?seg:'',branch:'main'};}
function b64enc(str){return btoa(unescape(encodeURIComponent(str)));}
function b64dec(b){return decodeURIComponent(escape(atob(b.replace(/\s/g,''))));}
function ghURL(g){return 'https://api.github.com/repos/'+encodeURIComponent(g.owner)+'/'+encodeURIComponent(g.repo)+'/contents/data.json';}
function ghFetch(g){
  return fetch(ghURL(g)+'?ref='+encodeURIComponent(g.branch||'main')+'&t='+Date.now(),{headers:{Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json'},cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('GitHub said '+r.status+(r.status===401?' (the token was not accepted)':r.status===404?' (repository or data.json not found)':''));return r.json();})
    .then(function(j){SERVER_SHA=j.sha;return JSON.parse(b64dec(j.content));});
}
function saveToGitHub(){
  var g=gh();if(!g){openGitHub();return;}
  var btn=document.getElementById('saveBtn');if(btn){btn.disabled=true;btn.textContent='Saving…';}
  var body=JSON.stringify(DB,null,1);
  var go=function(){
    return fetch(ghURL(g),{method:'PUT',headers:{Authorization:'Bearer '+g.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({message:'Inventory update '+stamp(),content:b64enc(body),sha:SERVER_SHA||undefined,branch:g.branch||'main'})})
      .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.message||('GitHub said '+r.status));return j;});});
  };
  var p=SERVER_SHA?go():ghFetch(g).then(go,go);
  p.then(function(j){SERVER_SHA=j.content&&j.content.sha;DIRTY=false;store(K_DRAFT,null);renderSaveBar();toast('Saved to GitHub. The public site updates in a minute or two.');})
   .catch(function(e){renderSaveBar();toast('Not saved: '+e.message);});
}
function downloadJSON(){
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(DB,null,1)],{type:'application/json'}));
  a.download='data.json';document.body.appendChild(a);a.click();setTimeout(function(){a.remove();},300);
}
function discardDraft(){if(!confirm('Discard your unsaved changes and reload the published data?'))return;store(K_DRAFT,null);location.reload();}
function renderSaveBar(){
  var el=document.getElementById('savebar');
  if(!DIRTY){el.innerHTML='';el.style.display='none';return;}
  el.style.display='block';
  var g=gh();
  el.innerHTML='<div class="in"><span><b>Unsaved changes.</b> '+(PREVIEW?'This preview keeps them on this device only.':(g?'Save to publish them to the website.':'They are kept on this device until you save.'))+'</span><span class="sp"></span>'+
   (PREVIEW?'':'<button class="btn btn-gold btn-sm" id="saveBtn">'+(g?'Save to GitHub':'Connect GitHub to save')+'</button>')+
   '<button class="btn btn-line btn-sm" id="dlBtn">Download data.json</button><button class="btn btn-line btn-sm" id="discBtn">Discard</button></div>';
  var sb=document.getElementById('saveBtn');if(sb)sb.onclick=saveToGitHub;
  document.getElementById('dlBtn').onclick=downloadJSON;document.getElementById('discBtn').onclick=discardDraft;
}
window.addEventListener('beforeunload',function(e){if(DIRTY&&!gh()){e.preventDefault();e.returnValue='';}});

/* ---------- modal ---------- */
function modal(title,lede,body,submitLabel,onSubmit,danger){
  closeModal();
  var ov=document.createElement('div');ov.className='ov';ov.id='ov';
  ov.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">'+esc(title)+'</h2>'+(lede?'<p class="lede">'+lede+'</p>':'')+
    '<form id="mf" novalidate>'+body+'<div class="err" id="merr"></div><div class="mfoot"><button type="button" class="btn btn-line" id="mcancel">Cancel</button>'+
    '<button type="submit" class="btn '+(danger?'btn-danger':'btn-gold')+'">'+esc(submitLabel)+'</button></div></form></div>';
  document.body.appendChild(ov);
  document.getElementById('mcancel').onclick=closeModal;
  ov.addEventListener('mousedown',function(e){if(e.target===ov)closeModal();});
  document.addEventListener('keydown',escClose);
  document.getElementById('mf').onsubmit=function(e){e.preventDefault();var err=onSubmit(new FormData(e.target));if(err){document.getElementById('merr').textContent=err;}else closeModal();};
  var f=ov.querySelector('input,select,textarea');if(f)setTimeout(function(){f.focus();},30);
}
function escClose(e){if(e.key==='Escape')closeModal();}
function closeModal(){var o=document.getElementById('ov');if(o)o.remove();document.removeEventListener('keydown',escClose);}
function fld(label,name,val,type,opts,cls,hint){
  var v=val==null?'':val,h='<div class="fld '+(cls||'')+'"><label for="f_'+name+'">'+label+'</label>';
  if(type==='select'){h+='<select id="f_'+name+'" name="'+name+'"><option value=""></option>'+opts.map(function(o){var ov=typeof o==='object'?o[0]:o,ol=typeof o==='object'?o[1]:o;return '<option value="'+esc(ov)+'"'+(String(ov)===String(v)?' selected':'')+'>'+esc(ol)+'</option>';}).join('')+'</select>';}
  else if(type==='textarea')h+='<textarea id="f_'+name+'" name="'+name+'">'+esc(v)+'</textarea>';
  else h+='<input id="f_'+name+'" name="'+name+'" type="'+(type||'text')+'" value="'+esc(v)+'"'+(type==='number'?' step="any" min="0"':'')+'>';
  return h+(hint?'<div class="hint">'+hint+'</div>':'')+'</div>';
}
function g(fd,k){var v=fd.get(k);v=v==null?'':String(v).trim();return v;}

/* ---------- item actions ---------- */
function itemForm(it){
  it=it||{qty:1,status:'Assigned'};
  return '<div class="fgrid">'+fld('Item name *','name',it.name,'text',null,'full')+
   fld('Category','category',it.category,'select',CATS)+fld('Condition','condition',it.condition,'select',CONDS)+
   fld('Location','location',it.location,'select',LOCS)+fld('Status','status',it.status,'select',STATUSES)+
   fld('Description / model','desc',it.desc,'text',null,'full')+
   '<div class="fsec">Purchase</div>'+
   fld('Date purchased','purchased',it.purchased,'date')+fld('Date assigned','assigned',it.assigned,'date')+
   fld('Quantity','qty',it.qty,'number')+fld('Unit cost ($)','unitCost',it.unitCost,'number',null,'','Total is calculated for you')+
   fld('Vendor / order #','vendor',it.vendor)+fld('Funding source','funding',it.funding,'select',FUNDS)+
   fld('Receipt or order link','link',it.link,'url',null,'full')+
   '<div class="fsec">Identification</div>'+
   fld('Asset tag','assetTag',it.assetTag)+fld('Serial #','serial',it.serial)+
   fld('QR sticker on item?','stickerApplied',it.stickerApplied,'select',['Yes','No'])+fld('Employee confirmed (date)','ack',it.ack,'date')+
   '<div class="fsec">Warranty</div>'+
   fld('Warranty?','warranty',it.warranty,'select',['Yes','No'])+fld('Warranty expires','warrantyExp',it.warrantyExp,'date')+
   fld('Warranty #','warrantyNo',it.warrantyNo)+fld('Warranty contact','warrantyProvider',it.warrantyProvider)+
   fld('Notes','notes',it.notes,'textarea',null,'full')+'</div>';
}
function readItem(fd,base){
  var it=Object.assign({},base||{});
  ['name','category','condition','location','status','desc','purchased','assigned','vendor','funding','link','assetTag','serial','stickerApplied','ack','warranty','warrantyExp','warrantyNo','warrantyProvider','notes'].forEach(function(k){var v=g(fd,k);if(v)it[k]=v;else delete it[k];});
  ['qty','unitCost'].forEach(function(k){var v=g(fd,k);if(v!==''&&!isNaN(+v))it[k]=+v;else delete it[k];});
  var t=it.qty&&it.unitCost?Math.round(it.qty*it.unitCost*100)/100:null;if(t!=null)it.total=t;else if(it.unitCost==null)delete it.total;
  if(!it.id)it.id=uid();
  return it;
}
function addItem(pos){
  var p=BYPOS[pos];
  modal('Add item to '+pos,esc(displayName(p)),itemForm(null),'Add item',function(fd){
    if(!g(fd,'name'))return 'Enter an item name.';
    var it=readItem(fd);if(!it.assigned)it.assigned=today();
    p.items.push(it);changed('Added '+it.name+'.');
  });
}
function editItem(pos,id){
  var p=BYPOS[pos],it=p.items.find(function(x){return x.id===id;});
  modal('Edit item',esc(pos+', '+displayName(p)),itemForm(it),'Save item',function(fd){
    if(!g(fd,'name'))return 'Enter an item name.';
    var n=readItem(fd,it);p.items[p.items.indexOf(it)]=n;changed('Updated '+n.name+'.');
  });
}
function archiveItem(pos,id){
  var p=BYPOS[pos],it=p.items.find(function(x){return x.id===id;});
  modal('Archive '+it.name,'It moves to '+esc(pos)+'’s history, so there is still a record of it.',
   '<div class="fgrid">'+fld('Reason','reason','Disposed','select',REASONS)+fld('Date','removed',today(),'date')+fld('Notes','removalNotes','','textarea',null,'full')+'</div>',
   'Archive item',function(fd){
    var h=Object.assign({},it,{reason:g(fd,'reason')||'Other',removed:g(fd,'removed')||today()});var n=g(fd,'removalNotes');if(n)h.removalNotes=n;
    p.items.splice(p.items.indexOf(it),1);p.history=p.history||[];p.history.push(h);changed(it.name+' archived.');
   },true);
}
function transferItem(pos,id){
  var p=BYPOS[pos],it=p.items.find(function(x){return x.id===id;});
  var opts=OFFICES.map(function(o){return active().filter(function(q){return q.office===o.k&&q.pos!==pos;}).sort(function(a,b){return a.pos<b.pos?-1:1;}).map(function(q){return [q.pos,posLabel(q)];});}).reduce(function(a,b){return a.concat(b);},[]);
  modal('Transfer '+it.name,'From '+esc(posLabel(p))+'. Remember to swap the QR sticker on the item.',
   '<div class="fgrid">'+fld('Transfer to *','to',null,'select',opts,'full')+fld('Date','date',today(),'date')+fld('Note','note','','text',null,'full')+'</div>',
   'Transfer item',function(fd){
    var to=g(fd,'to');if(!to)return 'Choose who the item is going to.';
    var q=BYPOS[to],d=g(fd,'date')||today(),note=g(fd,'note');
    var h=Object.assign({},it,{reason:'Transferred',removed:d,to:posLabel(q)});if(note)h.removalNotes=note;
    var n=Object.assign({},it,{id:uid(),assigned:d,notes:[it.notes,'From '+pos+' on '+fdate(d)+(note?': '+note:'')].filter(Boolean).join(' | ')});delete n.ack;
    if(n.stickerApplied==='Yes')n.stickerApplied='No';
    p.items.splice(p.items.indexOf(it),1);p.history=p.history||[];p.history.push(h);q.items.push(n);
    changed(it.name+' moved to '+to+'. Put a '+to+' sticker on it.');
   });
}
function restoreItem(pos,idx){
  var p=BYPOS[pos],h=p.history[idx];
  if(!confirm('Put '+h.name+' back on '+pos+'’s current list?'))return;
  var it=Object.assign({},h);['reason','removed','to','removalNotes'].forEach(function(k){delete it[k];});it.id=uid();
  p.history.splice(idx,1);p.items.push(it);changed(h.name+' restored.');
}

/* ---------- people actions ---------- */
function nextPos(off){var n=0;PEOPLE.forEach(function(p){if(p.pos.indexOf(off+'-')===0){var x=+p.pos.slice(4);if(x>=n)n=x+1;}});return off+'-'+String(n).padStart(2,'0');}
function addPerson(off){
  off=off||'RAP';
  modal('Add a person or position','Each position gets its own QR code. The number stays with the position if the person changes.',
   '<div class="fgrid">'+fld('Office','office',off,'select',OFFICES.map(function(o){return [o.k,o.name];}))+fld('Position number','pos',nextPos(off),'text',null,'','Format: '+off+'-08')+
   fld('Name *','name','','text',null,'full','Use VACANT for an open position')+fld('Title','title','','text',null,'full')+'</div>',
   'Add position',function(fd){
    var o=g(fd,'office'),pos=g(fd,'pos').toUpperCase(),name=g(fd,'name');
    if(!name)return 'Enter a name, or VACANT.';
    if(!/^(RAP|GPW|LFC)-\d{2}$/.test(pos))return 'Use the format '+o+'-08: office letters, a dash, and two digits.';
    if(pos.slice(0,3)!==o)return 'The number should start with '+o+' for this office.';
    if(BYPOS[pos])return pos+' is already used by '+displayName(BYPOS[pos])+'.';
    PEOPLE.push({pos:pos,name:name,title:g(fd,'title')||null,office:o,reviewed:today(),items:[],history:[]});
    changed(pos+' added.');location.hash=pos;
   });
  var sel=document.getElementById('f_office'),pi=document.getElementById('f_pos');
  sel.onchange=function(){pi.value=nextPos(sel.value);};
}
function editPerson(pos){
  var p=BYPOS[pos];
  modal('Edit '+pos,'Changing the name or title does not change the QR code.',
   '<div class="fgrid">'+fld('Name *','name',p.name,'text',null,'full')+fld('Title','title',p.title,'text',null,'full')+
   fld('Sheet label','sheetLabel',p.sheetLabel,'text',null,'','Optional, e.g. RAP Office')+fld('Last reviewed','reviewed',p.reviewed,'date')+'</div>',
   'Save',function(fd){
    if(!g(fd,'name'))return 'Enter a name, or VACANT.';
    p.name=g(fd,'name');p.title=g(fd,'title')||null;p.reviewed=g(fd,'reviewed')||null;var sl=g(fd,'sheetLabel');if(sl)p.sheetLabel=sl;else delete p.sheetLabel;
    changed(pos+' updated.');
   });
}
function departPerson(pos){
  var p=BYPOS[pos];
  modal(displayName(p)+' is leaving','Choose what happens to '+esc(pos)+'.',
   '<label class="choice"><input type="radio" name="how" value="vacant" checked><b>Keep the position and its items (recommended)</b><span>'+esc(pos)+' becomes VACANT. Everything stays assigned for the next hire, and the stickers keep working.</span></label>'+
   '<label class="choice"><input type="radio" name="how" value="archive"><b>Archive the whole position</b><span>'+esc(pos)+' disappears from the office dashboard. Its items stay attached in the Archived list, and you can restore it later.</span></label>'+
   '<div class="fgrid">'+fld('Date','date',today(),'date')+fld('Note','note','','text')+'</div>',
   'Confirm',function(fd){
    var how=fd.get('how'),d=g(fd,'date')||today(),note=g(fd,'note');
    p.former=p.former||[];p.former.push({name:p.name,left:d,note:note||undefined});
    if(how==='vacant'){var old=p.name;p.name='VACANT';changed(old+' removed. '+pos+' is now vacant.');}
    else{p.archived={date:d,note:note||undefined};changed(pos+' archived.');location.hash=p.office;}
   },true);
}
function fillPosition(pos){
  var p=BYPOS[pos];
  modal('Fill '+pos,'The new person takes over everything assigned to this position.',
   '<div class="fgrid">'+fld('Name *','name','','text',null,'full')+fld('Title','title',p.title,'text',null,'full')+fld('Start date','date',today(),'date')+'</div>',
   'Assign',function(fd){
    if(!g(fd,'name'))return 'Enter the new person’s name.';
    p.name=g(fd,'name');p.title=g(fd,'title')||p.title;p.started=g(fd,'date')||today();
    p.items.forEach(function(it){delete it.ack;});
    changed(p.name+' now holds '+pos+'. Have them confirm each item.');
   });
}
function restorePerson(pos){var p=BYPOS[pos];if(!confirm('Restore '+pos+' to the '+p.office+' dashboard?'))return;delete p.archived;changed(pos+' restored.');}

/* ---------- top bar ---------- */
function setBar(crumbs,btns){
  document.getElementById('crumbs').innerHTML=crumbs.map(function(c,i){
    var last=i===crumbs.length-1;
    return (i?'<span class="sep">/</span>':'')+(last?'<b>'+esc(c[0])+'</b>':'<a href="'+c[1]+'">'+esc(c[0])+'</a>');
  }).join('');
  document.getElementById('barBtns').innerHTML=btns||'';
}
function localWarn(){
  if(PREVIEW)return '<div class="banner-warn">Preview only. Changes you make here stay on this device, and the QR codes open this preview. Print stickers from your GitHub address once it is live.</div>';
  return location.protocol==='file:'?'<div class="banner-warn">You’re viewing this file from your computer. QR codes made here point to your computer, not the website, so print stickers from the GitHub Pages address instead.</div>':'';
}

/* ---------- views ---------- */
function viewHome(){
  setBar([['All offices','#']],(isAdmin()?'<a class="btn btn-ghost hide-m" href="#supplies">Supply budget</a> ':'')+'<a class="btn btn-ghost hide-m" href="#print">Print all stickers</a> <a class="btn btn-gold" href="#settings">Settings &amp; backup</a>');
  var A=active(),all={items:0,value:0,soon:0,stick:0};A.forEach(function(p){var s=summary(p);all.items+=s.items;all.value+=s.value;all.soon+=s.soon;all.stick+=s.stick;});
  var arch=PEOPLE.filter(function(p){return p.archived;}).length,rcH=reqCounts(A);
  var h=localWarn()+'<section class="hero"><h1>Foundation First inventory</h1><div class="sub">Equipment assigned to each person and office. Last change '+esc(DB.generated||'')+'.</div>'+
  '<div class="stats"><div class="stat"><b>'+A.length+'</b><span>sheets</span></div><div class="stat"><b>'+all.items+'</b><span>items</span></div>'+
  '<div class="stat'+(all.soon?' alert':'')+'"><b>'+all.soon+'</b><span>warranties ending in 90 days</span></div><div class="stat"><b>'+all.stick+'</b><span>stickers still needed</span></div>'+
  '<div class="stat'+(rcH.pending?' alert':'')+'"><b>'+rcH.pending+'</b><span>requests waiting for approval</span></div></div></section>';

function route(keep){
  var raw=location.hash.replace(/^#/,''),m=raw.match(/^([A-Za-z]{3}-\d{2})\/request\/([A-Za-z0-9_-]+)$/);
  if(m)return importRequestLink(m[1].toUpperCase(),m[2]);
  var h=decodeURIComponent(raw).trim().toUpperCase();
  var y=window.scrollY;
  if(!h)viewHome();
  else if(h==='PRINT')viewPrint('');
  else if(/^PRINT-(RAP|GPW|LFC)$/.test(h))viewPrint(h.slice(6));
  else if(h==='ARCHIVED')viewArchived();
  else if(h==='SETTINGS')viewSettings();
  else if(h==='REQUEST-POSTER')viewRequestPoster();
  else if(h==='REQUEST-FORM')viewRequestForm();
  else if(h==='SUPPLIES')viewSupplies();
  else if(OFF[h])viewOffice(h);
  else if(BYPOS[h])viewPerson(h);
  else viewMissing(h);
  window.scrollTo(0,keep===true?y:0);
}
function normalize(){
  PEOPLE=(DB.people||[]).filter(function(p){return p.pos;});DB.people=PEOPLE;
  PEOPLE.forEach(function(p){p.pos=String(p.pos).toUpperCase();p.items=p.items||[];p.history=p.history||[];p.requests=p.requests||[];p.items.forEach(function(it){if(!it.id)it.id=uid();});});
  index();
}
function start(db,dirty){
  DB=db;normalize();DIRTY=!!dirty;renderSaveBar();
  window.addEventListener('hashchange',function(){route();});route();
}
(function boot(){
  var draft=load(K_DRAFT);
  var useDraft=function(base){
    if(draft&&draft.db&&draft.db.people){
      if(PREVIEW||confirm('You have changes from '+draft.savedAt+' that were not saved to GitHub. Keep working with them?\n\nOK keeps them. Cancel discards them.'))return start(draft.db,true);
      store(K_DRAFT,null);
    }
    start(base,false);
  };
  if(PREVIEW)return useDraft(window.__DATA__);
  var g0=gh();
  var pub=function(){return fetch('data.json?v='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();});};
  (g0?ghFetch(g0).catch(pub):pub()).then(useDraft).catch(function(){
    if(draft&&draft.db)return start(draft.db,true);
    setBar([['Inventory','#']],'');
    document.getElementById('app').innerHTML='<section class="hero"><h1>The inventory data didn’t load</h1><div class="sub">'+
      (location.protocol==='file:'?'Browsers block data files opened straight from your computer. Upload the files to GitHub and open the GitHub Pages address.':'Check that data.json is in the same folder as index.html in your GitHub repository, then refresh.')+'</div></section>';
  });
})();

/* ---------- item requests ---------- */
var RSTAT={Pending:'w-soon',Approved:'w-ok','Not approved':'w-exp',Ordered:'c-elec',Received:'c-misc'};
function isAdmin(){return PREVIEW||!!gh();}
function settings(){DB.settings=DB.settings||{};return DB.settings;}
function reqBadge(r){return '<span class="badge '+(RSTAT[r.status]||'c-misc')+'">'+esc(r.status)+'</span>';}
function openReqs(p){return (p.requests||[]).filter(function(r){return r.status==='Pending'||r.status==='Approved'||r.status==='Ordered';});}
function reqCounts(list){var c={pending:0,approved:0,ordered:0};list.forEach(function(p){(p.requests||[]).forEach(function(r){if(r.status==='Pending')c.pending++;if(r.status==='Approved')c.approved++;if(r.status==='Ordered')c.ordered++;});});return c;}
function b64url(s){return b64enc(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function unb64url(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return b64dec(s);}

function requestForm(p,r){
  r=r||{by:/^vacant$/i.test(p.name)?'':p.name,qty:1};
  var kf=formCfg().fields.find(function(f){return f.key==='kind';});
  return '<div class="fgrid">'+fld('Your name *','by',r.by,'text',null,'full')+fld('Request type *','kind',r.kind,'select',[['supplies',kf.options[0]],['other',kf.options[1]]],'full')+
    fld('What do you need? *','item',r.item,'text',null,'full','For example: Logitech wireless mouse')+
    fld('Link to the item *','link',r.link,'url',null,'full','Paste the Amazon or store page')+
    fld('Quantity','qty',r.qty,'number')+fld('Price each ($)','cost',r.cost,'number',null,'','From the link, if you know it')+
    fld('Needed by','needed',r.needed,'date')+fld('Funding source','funding',r.funding,'select',FUNDS,'','Leave blank if unsure')+
    fld('Why do you need it?','reason',r.reason,'textarea',null,'full')+'</div>';
}
function readReq(fd,base){
  var r=Object.assign({},base||{});
  ['by','kind','item','link','needed','funding','reason'].forEach(function(k){var v=g(fd,k);if(v)r[k]=v;else delete r[k];});
  ['qty','cost'].forEach(function(k){var v=g(fd,k);if(v!==''&&!isNaN(+v))r[k]=+v;else delete r[k];});
  if(!r.id)r.id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  if(!r.submitted)r.submitted=today();
  if(!r.status)r.status='Pending';
  return r;
}
function reqCheck(fd){if(!g(fd,'by'))return 'Enter your name.';if(!g(fd,'kind'))return 'Choose the request type.';if(!g(fd,'item'))return 'Say what you need.';if(!g(fd,'link'))return 'Paste a link to the item so it can be ordered.';return null;}
function newRequest(pos){
  var p=BYPOS[pos];
  if(isAdmin()){
    modal('Log a request for '+pos,esc(displayName(p))+'. It starts as Pending until you approve it or not.'+(PREVIEW?' To see what staff see, use <b>Try the staff version</b>.':''),requestForm(p),'Add request',function(fd){
      var e=reqCheck(fd);if(e)return e;var r=readReq(fd);p.requests=p.requests||[];p.requests.push(r);changed('Request added to '+pos+'.');
    });
    if(PREVIEW){var f=document.querySelector('#mf .mfoot');var b=document.createElement('button');b.type='button';b.className='btn btn-line';b.textContent='Try the staff version';
      b.onclick=function(){closeModal();staffRequest(pos);};f.insertBefore(b,f.firstChild);}
  } else location.href='request.html#'+pos;
}
function staffRequest(pos){
  var p=BYPOS[pos],to=settings().requestEmail;
  if(!to&&!PREVIEW){modal('Requests aren’t set up yet','Ask the operations team to turn on item requests in Settings.','', 'OK',function(){});return;}
  modal('Request an item for '+pos,'Fill this in and choose Send. Your email app opens with everything filled in; just press Send there.',requestForm(p),'Send request',function(fd){
    var e=reqCheck(fd);if(e)return e;
    var r=readReq(fd);var code=b64url(JSON.stringify(r));
    var addLink=baseURL()+'#'+pos+'/request/'+code;
    var lines=['New inventory request','','Position: '+pos+' ('+displayName(p)+')','Requested by: '+r.by,'Item: '+r.item,'Link: '+r.link,'Quantity: '+(r.qty||1)];
    if(r.cost)lines.push('Price each: '+money(r.cost));if(r.needed)lines.push('Needed by: '+fdate(r.needed));if(r.funding)lines.push('Funding: '+r.funding);if(r.reason)lines.push('Why: '+r.reason);
    lines.push('','To add this to the inventory tracker, open:',addLink);
    var href='mailto:'+encodeURIComponent(to||'operations@example.org')+'?subject='+encodeURIComponent('Inventory request – '+pos+' – '+r.item)+'&body='+encodeURIComponent(lines.join('\n'));
    window.__lastMailto=href;
    if(PREVIEW){toast('In the live site, your email app opens now. Here is the link it would include.');setTimeout(function(){location.hash=pos+'/request/'+code;},600);return;}
    var ml=document.createElement('a');ml.href=href;ml.style.display='none';document.body.appendChild(ml);ml.click();setTimeout(function(){ml.remove();},1000);
    toast('Your email app should open with the request filled in. Press Send there to submit it.');
  });
}
function importRequestLink(pos,code){
  var p=BYPOS[pos];var r;
  try{r=JSON.parse(unb64url(code));}catch(e){toast('That request link is damaged. Ask for it to be sent again.');location.hash=pos;return;}
  if(!p){viewMissing(pos);return;}
  history.replaceState(null,'','#'+pos);viewPerson(pos);
  if(!isAdmin()){toast('Request links are for the operations team. Open it on a device connected to GitHub.');return;}
  if((p.requests||[]).some(function(x){return x.id===r.id;})){toast('This request is already in '+pos+'’s list.');return;}
  modal('Add this request to '+pos+'?',esc(r.by||'')+' asked for this on '+fdate(r.submitted)+'.'+(isSupplyReq(r)?' <b>'+esc(reqBudgetLine(p,r))+'</b>':''),
    '<div class="detail" style="display:grid;grid-template-columns:1fr 1fr;gap:8px 18px">'+
    [['Type',isSupplyReq(r)?'Office supplies':'Equipment or other'],['Item',r.item],['Quantity',r.qty||1],['Price each',money(r.cost)],['Needed by',fdate(r.needed)],['Funding',r.funding],['Why',r.reason]].concat((r.extra||[]).map(function(x){return [x.label,x.value];})).filter(function(x){return x[1];}).map(function(x){return '<div><span>'+x[0]+'</span>'+esc(x[1])+'</div>';}).join('')+
    (r.link?'<div style="grid-column:1/-1"><span>Link</span><a href="'+esc(r.link)+'" target="_blank" rel="noopener">'+esc(r.link)+'</a></div>':'')+'</div>',
    'Add as Pending',function(){r.status='Pending';p.requests=p.requests||[];p.requests.push(r);changed('Request added to '+pos+'. Approve it or not from their page.');});
}
function decideReq(pos,id,ok){
  var p=BYPOS[pos],r=p.requests.find(function(x){return x.id===id;});
  var bl=reqBudgetLine(p,r);
  modal((ok?'Approve ':'Don’t approve ')+r.item,(bl?'<b>'+esc(bl)+'</b> ':'')+(ok?'Next you’ll order it and mark it Ordered'+(isSupplyReq(r)?', which counts it against the allowance':'')+'.':'The note is shown on '+esc(pos)+'’s page, so keep it short and clear.'),
   '<div class="fgrid">'+fld('Decided by','decidedBy',settings().approver||'','text')+fld('Date','decided',today(),'date')+fld(ok?'Note (optional)':'Reason *','decisionNote','','textarea',null,'full')+'</div>',
   ok?'Approve':'Not approved',function(fd){
    if(!ok&&!g(fd,'decisionNote'))return 'Add a short reason.';
    r.status=ok?'Approved':'Not approved';r.decided=g(fd,'decided')||today();r.decidedBy=g(fd,'decidedBy')||null;r.decisionNote=g(fd,'decisionNote')||null;
    if(r.decidedBy)settings().approver=r.decidedBy;
    changed(r.item+(ok?' approved.':' marked not approved.'));
   },!ok);
}
function orderReq(pos,id){
  var p=BYPOS[pos],r=p.requests.find(function(x){return x.id===id;});
  modal('Mark '+r.item+' as ordered',isSupplyReq(r)?'This logs the cost (price × quantity) against the office supply allowance.':'',
   '<div class="fgrid">'+fld('Date ordered','ordered',today(),'date')+fld('Vendor / order #','orderNo',r.orderNo,'text')+
   fld('Actual price each ($)','actualCost',r.actualCost||r.cost,'number')+fld('Funding source','funding',r.funding,'select',FUNDS)+'</div>',
   'Mark ordered',function(fd){
    r.status='Ordered';r.ordered=g(fd,'ordered')||today();r.orderNo=g(fd,'orderNo')||null;var c=g(fd,'actualCost');r.actualCost=c!==''&&!isNaN(+c)?+c:null;r.funding=g(fd,'funding')||r.funding||null;
    logRequestPurchase(p,r);
    changed(r.item+' marked ordered.'+(isSupplyReq(r)?' '+reqBudgetLine(p,{kind:'supplies'}):''));
   });
}
function receiveReq(pos,id){
  var p=BYPOS[pos],r=p.requests.find(function(x){return x.id===id;});
  var draft={name:r.item,link:r.link,qty:r.qty||1,unitCost:r.actualCost!=null?r.actualCost:r.cost,vendor:r.orderNo,purchased:r.ordered,assigned:today(),funding:r.funding,status:'Assigned',condition:'New',notes:'Requested by '+(r.by||'')+' on '+fdate(r.submitted)};
  modal('Received: add '+r.item+' to '+pos,'Check the details, add the serial number if it has one, then save. The request closes as Received.',itemForm(draft),'Add to inventory',function(fd){
    if(!g(fd,'name'))return 'Enter an item name.';
    var it=readItem(fd);p.items.push(it);r.status='Received';r.received=today();r.itemId=it.id;
    if(r.purchaseId){var px=SUP().purchases.find(function(y){return y.id===r.purchaseId;});if(px){px.addedToInventory=true;px.itemId=it.id;}}
    changed(it.name+' added to '+pos+'.'+(total(it)>50?' It needs a '+pos+' sticker.':''));
  });
}
function reopenReq(pos,id){var p=BYPOS[pos],r=p.requests.find(function(x){return x.id===id;});unlogRequestPurchase(r);r.status='Pending';delete r.decided;delete r.decisionNote;changed(r.item+' set back to Pending.');}
function deleteReq(pos,id){var p=BYPOS[pos],r=p.requests.find(function(x){return x.id===id;});if(!confirm('Delete the request for '+r.item+'?'+(r.purchaseId?' Its cost will also come off the supply budget.':'')+' This can’t be undone.'))return;unlogRequestPurchase(r);p.requests.splice(p.requests.indexOf(r),1);changed('Request deleted.');}
function editReq(pos,id){
  var p=BYPOS[pos],r=p.requests.find(function(x){return x.id===id;});
  modal('Edit request','',requestForm(p,r),'Save',function(fd){var e=reqCheck(fd);if(e)return e;p.requests[p.requests.indexOf(r)]=readReq(fd,r);changed('Request updated.');});
}
function reqRow(p,r){
  var adm=isAdmin()&&!p.archived,acts='';
  if(adm){
    if(r.status==='Pending')acts='<button class="btn btn-gold btn-sm" data-q="ok" data-id="'+r.id+'">Approve</button><button class="btn btn-danger btn-sm" data-q="no" data-id="'+r.id+'">Not approved</button><button class="btn btn-line btn-sm" data-q="edit" data-id="'+r.id+'">Edit</button>';
    else if(r.status==='Approved')acts='<button class="btn btn-gold btn-sm" data-q="order" data-id="'+r.id+'">Mark ordered</button><button class="btn btn-line btn-sm" data-q="reopen" data-id="'+r.id+'">Back to pending</button>';
    else if(r.status==='Ordered')acts='<button class="btn btn-gold btn-sm" data-q="recv" data-id="'+r.id+'">Received: add to inventory</button>'+(isSupplyReq(r)?'<button class="btn btn-line btn-sm" data-q="recvs" data-id="'+r.id+'">Received: supplies only</button>':'');
    else acts='<button class="btn btn-line btn-sm" data-q="reopen" data-id="'+r.id+'">Reopen</button>';
    acts+='<button class="btn btn-line btn-sm" data-q="del" data-id="'+r.id+'">Delete</button>';
  }
  var meta=['Asked by '+(r.by||'unknown')+' on '+fdate(r.submitted)];
  if(r.qty&&r.qty!==1)meta.push('Qty '+r.qty);if(r.cost)meta.push(money(r.cost)+' each');if(r.needed)meta.push('needed by '+fdate(r.needed));
  var dec='';
  if(r.status==='Approved'||r.status==='Not approved')dec=(r.status==='Approved'?'Approved':'Not approved')+(r.decidedBy?' by '+esc(r.decidedBy):'')+' on '+fdate(r.decided)+(r.decisionNote?': '+esc(r.decisionNote):'');
  if(r.status==='Ordered')dec='Ordered '+fdate(r.ordered)+(r.orderNo?' ('+esc(r.orderNo)+')':'');
  if(r.status==='Received')dec='Received '+fdate(r.received)+' and added to the list';
  var bline=adm&&isSupplyReq(r)&&(r.status==='Pending'||r.status==='Approved')?reqBudgetLine(p,r):'';
  return '<div class="rq"><div class="rq-main"><div class="rq-top"><b>'+esc(r.item)+'</b> '+reqBadge(r)+(isSupplyReq(r)?' <span class="badge c-sup">Office supplies</span>':'')+'</div>'+(bline?'<div class="rq-meta" style="color:var(--ink)"><b>'+esc(bline)+'</b></div>':'')+
    '<div class="rq-meta">'+esc(meta.join(', '))+'</div>'+
    (r.link?'<div class="rq-meta"><a href="'+esc(r.link)+'" target="_blank" rel="noopener">Open item link</a></div>':'')+
    (r.reason?'<div class="rq-meta">Why: '+esc(r.reason)+'</div>':'')+(r.extra||[]).map(function(x){return '<div class="rq-meta">'+esc(x.label)+': '+esc(x.value)+'</div>';}).join('')+(dec?'<div class="rq-dec">'+dec+'</div>':'')+'</div>'+
    (acts?'<div class="acts noprint">'+acts+'</div>':'')+'</div>';
}
function requestsSection(p){
  var rq=(p.requests||[]).slice().reverse(),open=rq.filter(function(r){return ['Pending','Approved','Ordered'].indexOf(r.status)>-1;}),closed=rq.filter(function(r){return open.indexOf(r)<0;});
  var h='<div class="reqs"><div class="reqs-head"><h3>Item requests'+(open.length?' <span class="badge w-soon">'+open.length+' open</span>':'')+'</h3>'+
    (p.archived?'':'<button class="btn btn-gold btn-sm noprint" id="reqBtn">Request an item</button>')+'</div>';
  if(!rq.length)h+='<div class="empty" style="padding:6px 0 4px">No requests yet. Need something for your work? Choose Request an item and paste a link.</div>';
  h+=open.map(function(r){return reqRow(p,r);}).join('');
  if(closed.length)h+='<details class="rq-closed"><summary>Closed requests ('+closed.length+')</summary>'+closed.map(function(r){return reqRow(p,r);}).join('')+'</details>';
  return h+'</div>';
}
function wireRequests(p){
  var b=document.getElementById('reqBtn');if(b)b.onclick=function(){newRequest(p.pos);};
  document.querySelectorAll('[data-q]').forEach(function(x){x.onclick=function(){var id=x.getAttribute('data-id'),a=x.getAttribute('data-q');
    ({ok:function(){decideReq(p.pos,id,true);},no:function(){decideReq(p.pos,id,false);},edit:function(){editReq(p.pos,id);},order:function(){orderReq(p.pos,id);},
      recv:function(){receiveReq(p.pos,id);},recvs:function(){var q=p.requests.find(function(x){return x.id===id;});q.status='Received';q.received=today();
      if(q.purchaseId){var px=SUP().purchases.find(function(y){return y.id===q.purchaseId;});if(px)px.noInventory=true;}changed(q.item+' received.');},reopen:function(){reopenReq(p.pos,id);},del:function(){deleteReq(p.pos,id);}})[a]();};});
}
function homeRequestsPanel(){
  var rows=[];active().forEach(function(p){(p.requests||[]).forEach(function(r){if(['Pending','Approved','Ordered'].indexOf(r.status)>-1)rows.push({p:p,r:r});});});
  var rank={Pending:0,Approved:1,Ordered:2};rows.sort(function(a,b){return rank[a.r.status]-rank[b.r.status]||((a.r.submitted||'')<(b.r.submitted||'')?-1:1);});
  return '<div class="section"><h3>Open item requests</h3><div class="panel">'+(rows.length?rows.map(function(x){
    return '<a class="alert-row" href="#'+x.p.pos+'"><b style="color:'+OFF[x.p.office].c+'">'+esc(x.p.pos)+'</b><span><b>'+esc(x.r.item)+'</b> <span style="color:var(--muted)">for '+esc(displayName(x.p))+', asked '+fdate(x.r.submitted)+'</span></span>'+reqBadge(x.r)+'</a>';
  }).join(''):'<div class="empty">No open requests.</div>')+'</div></div>';
}

function wireSettingsRequests(){
  paintQRs();
  var cp=document.getElementById('reqCopy');if(cp)cp.onclick=function(){(navigator.clipboard?navigator.clipboard.writeText(requestPageURL()):Promise.reject()).then(function(){toast('Request page link copied.');},function(){prompt('Copy this link:',requestPageURL());});};
  var b=document.getElementById('reqSave');if(!b)return;

}

var FORM_DEFAULT={title:'Request an item',
  intro:'Need something for your work? Paste a link to it below. Your request goes to the operations team for approval, and you’ll hear back by email.',
  button:'Send request',done:'You’ll hear back once it’s approved or not.',
  note:'Your name isn’t listed, or something looks wrong? Contact the operations team.',

/* ---------- office supply budget ($ per person per fiscal year, July 1 – June 30) ---------- */
function SUP(){DB.supplies=DB.supplies||{};var s=DB.supplies;if(s.allowance==null)s.allowance=100;s.overrides=s.overrides||{};s.purchases=s.purchases||[];return s;}
function fyOf(d){if(!d)return null;var y=+String(d).slice(0,4),m=+String(d).slice(5,7);return m>=7?y+1:y;}
function fyLabel(fy){return 'FY'+String(fy).slice(2);}
function fyRange(fy){return 'July 1, '+(fy-1)+' – June 30, '+fy;}
function curFY(){return fyOf(today());}
var SUPFY=null;
function budgetPeople(){
  var by={};
  active().forEach(function(p){
    if(/-00$/.test(p.pos)||isVacant(p)||!OFF[p.office])return;
    var k=(p.name||'').trim();if(!k)return;
    (by[k]=by[k]||{name:k,positions:[]}).positions.push(p);
  });
  return Object.keys(by).map(function(k){var b=by[k];
    b.positions.sort(function(a,c){return (+a.pos.slice(4))-(+c.pos.slice(4))||(a.pos<c.pos?-1:1);});
    b.primary=b.positions[0];b.office=b.primary.office;return b;});
}
function allowanceFor(name){var s=SUP();return s.overrides[name]!=null?+s.overrides[name]:+s.allowance;}
function purchasesFor(name,fy){return SUP().purchases.filter(function(x){return x.name===name&&(!fy||fyOf(x.date)===fy);});}
function spentFor(name,fy){return Math.round(purchasesFor(name,fy).reduce(function(t,x){return t+(+x.amount||0);},0)*100)/100;}
function leftFor(name,fy){return Math.round((allowanceFor(name)-spentFor(name,fy))*100)/100;}
function supStatus(rem){return rem<0?['Over budget','w-exp']:rem===0?['Fully spent','c-misc']:rem<25?['Low balance','w-soon']:['Available','w-ok'];}
function supBadge(rem){var s=supStatus(rem);return '<span class="badge '+s[1]+'">'+s[0]+'</span>';}
function budgetOf(p){var b=budgetPeople().find(function(x){return x.name===p.name;});return b||null;}

     ps.map(function(b){

       return '<div class="sup-row" tabindex="0" data-n="'+esc(b.name)+'"><div><b>'+esc(b.name)+'</b><small>'+b.positions.map(function(p){return p.pos;}).join(', ')+'</small></div>'+
        '<div class="num">'+money(a)+(s.overrides[b.name]!=null?' <span class="badge c-elec" title="Custom allowance">custom</span>':'')+'</div><div class="num">'+money(sp)+'</div><div class="num"><b>'+money(rem)+'</b></div><div class="num">'+list.length+'</div><div>'+supBadge(rem)+'</div>'+

  document.getElementById('app').innerHTML=h;

  document.querySelectorAll('.sup-row').forEach(function(r){r.addEventListener('click',function(e){if(e.target.closest('button,a'))return;r.classList.toggle('open');});

  var inv=x.addedToInventory?'<span class="badge w-ok">In inventory</span>':x.noInventory?'<span class="badge c-misc">No inventory needed</span>':'<span class="badge w-soon">Not in inventory yet</span>';
  return '<div class="sup-p"><div><b>'+esc(x.item)+'</b><small>'+fdate(x.date)+(showName?', '+esc(x.name):'')+(x.vendor?', '+esc(x.vendor):'')+(x.receipt?', '+esc(x.receipt):'')+(x.requestId?', from a request':'')+'</small></div>'+

function purchaseModal(x,name){
  var people=budgetPeople().sort(function(a,b){return a.name<b.name?-1:1;});
  x=x||{date:today(),name:name||''};
  var body='<div class="fgrid">'+fld('Person *','name',x.name,'select',people.map(function(b){return [b.name,b.name+' ('+b.positions.map(function(p){return p.pos;}).join(', ')+')'];}),'full')+
    fld('Date *','date',x.date,'date')+fld('Amount ($) *','amount',x.amount,'number',null,'','The total for this purchase')+
    fld('Item *','item',x.item,'text',null,'full')+fld('Vendor / store','vendor',x.vendor)+fld('Receipt or order #','receipt',x.receipt)+
    fld('Added to inventory?','inv',x.addedToInventory?'Yes':x.noInventory?'Not needed':'No','select',['No','Yes','Not needed'])+fld('Notes','notes',x.notes,'text')+'</div><div class="err" id="supWarn" style="color:var(--warn)"></div>';
  modal(x.id?'Edit purchase':'Add an office supply purchase','Counts toward the person’s '+money(SUP().allowance)+' for the fiscal year of the purchase date (July 1 – June 30).',body,x.id?'Save':'Add purchase',function(fd){
    var n=g(fd,'name'),a=g(fd,'amount'),it=g(fd,'item'),d=g(fd,'date');
    if(!n)return 'Choose the person.';if(!d)return 'Enter the date.';if(!it)return 'Describe the item.';if(a===''||isNaN(+a))return 'Enter the amount.';
    var b=budgetPeople().find(function(y){return y.name===n;});
    var rec=x.id?x:{id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)};
    Object.assign(rec,{name:n,pos:b?b.primary.pos:rec.pos,date:d,amount:Math.round(+a*100)/100,item:it,vendor:g(fd,'vendor')||undefined,receipt:g(fd,'receipt')||undefined,notes:g(fd,'notes')||undefined,
      addedToInventory:g(fd,'inv')==='Yes',noInventory:g(fd,'inv')==='Not needed'});
    if(!x.id)SUP().purchases.push(rec);
    window.__supOpen=n;var left=leftFor(n,fyOf(d));
    changed((x.id?'Purchase updated. ':'Purchase added. ')+n+' has '+money(left)+' left for '+fyLabel(fyOf(d))+'.');
  });
  var warn=function(){var n=document.getElementById('f_name').value,a=+document.getElementById('f_amount').value||0,d=document.getElementById('f_date').value;
